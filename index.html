<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASEL Sale</title>
<meta name="description" content="ASEL Pipeline Smarthome – quản lý hồ sơ bán hàng">
<meta name="theme-color" content="#008069" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202c33" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ASEL Sale">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<style>
  /* nền trùng màu thanh trên / menu đáy của app để phần tai thỏ & vạch vuốt liền mạch */
  html, body { margin: 0; height: 100%; background: #f0f2f5; overflow: hidden; }
  /* KHÔNG dùng status-bar "black-translucent": iPhone tính thiếu chiều cao (lộ dải trắng ở đáy) và chừa tai thỏ 2 lần */
  @media (prefers-color-scheme: dark) { html, body { background: #0b141a; } #splash { background: #111b21 !important; color: #8696a0 !important; } }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; box-sizing: border-box; background: inherit;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  /* đáy: app tự chừa vạch vuốt (nhận số đo sab qua tin nhắn) để menu đáy nằm sát như WhatsApp */
  #sa { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #667781;
            background: #ffffff; transition: opacity .35s; z-index: 2; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(11,20,26,.18); }
  #splash .dot { width: 34px; height: 4px; border-radius: 4px; background: #d1e7e2; overflow: hidden; position: relative; }
  #splash .dot::after { content: ""; position: absolute; inset: 0; width: 40%; background: #008069; border-radius: 4px;
                        animation: run 1s ease-in-out infinite alternate; }
  @keyframes run { to { transform: translateX(150%); } }
  #splash.hide { opacity: 0; pointer-events: none; }
  #offline { display: none; text-align: center; padding: 0 24px; }
  #offline button { margin-top: 10px; font: inherit; color: #fff; background: #008069; border: 0; border-radius: 999px; padding: 9px 20px; }
  
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div class="dot" id="loading"></div>
  <div id="offline">Không có mạng. Kiểm tra wifi / 4G rồi thử lại.<br><button onclick="location.reload()">Thử lại</button></div>
</div>
<div id="sa"></div>
<iframe id="app" title="ASEL Pipeline Smarthome" allow="clipboard-write; clipboard-read"></iframe>
<script>
  // Địa chỉ app Google Script (link duy nhất). Giữ nguyên query (?ma=...) để mở thẳng hồ sơ.
  var GAS = 'https://script.google.com/macros/s/AKfycbzah9vWGjmFnDFJKeBpRx_PUASQB-L-EgRae5kBThArgLDyWMscpkjC12Bj_b0QTEbqgw/exec';
  var splash = document.getElementById('splash'), frame = document.getElementById('app');
  function showOffline() { document.getElementById('loading').style.display = 'none'; document.getElementById('offline').style.display = 'block'; }
  if (!navigator.onLine) { showOffline(); }
  else {
    frame.addEventListener('load', function () { setTimeout(function () { splash.classList.add('hide'); }, 250); });
    frame.src = GAS + location.search;
    setTimeout(function () { splash.classList.add('hide'); }, 15000);
  }
  window.addEventListener('online', function () { if (!frame.src) location.reload(); });
  // Giữ hộ mã đăng nhập cho app Google (iPhone xóa bộ nhớ của khung Google mỗi lần tắt app).
  // Chỉ nói chuyện với khung của Google Apps Script; chỉ lưu 2 mục dưới đây.
  var KEYS = ['asel-gas-token', 'asel-gas-email'];
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin) || !e.data || !e.data.asel) return;
    var d = e.data;
    try {
      if (d.asel === 'get') {
        var kv = {}; KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v) kv[k] = v; });
        e.source.postMessage({ asel: 'store', kv: kv, sab: document.getElementById('sa').offsetHeight }, e.origin);
      } else if (d.asel === 'set' && KEYS.indexOf(d.k) >= 0) {
        if (d.v) localStorage.setItem(d.k, String(d.v)); else localStorage.removeItem(d.k);
      }
    } catch (_) {}
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
